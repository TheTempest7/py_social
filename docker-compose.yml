services:
  # 1. Твой Go-сервер
  app:
    build: 
      context: .                    
      dockerfile: app-go/Dockerfile 
    ports:
      - "8080:8080"
    restart: unless-stopped 
    # 👇 Подключаем твой .env файл, чтобы сервер знал ключи
    env_file:
      - ./app-go/.env
    environment:
      # Переопределяем пути для работы внутри контейнера
      - DB_PATH=data/social_app.db
      - MIGRATIONS_PATH=migrations
      
      # ВАЖНО: Внутри докер-сети обращаемся к сервисам по их ИМЕНАМ, а не localhost
      - REDIS_ADDR=redis:6379  
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_started
      postgres:
        condition: service_healthy 
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./app-go/data:/app/data         

  # 2. Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data   
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 3. MinIO
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"       # API
      - "9001:9001"       # Веб-консоль (http://localhost:9001)
    environment:
      # Берем логин и пароль из твоего корневого .env (где MINIO_ACCESS_KEY)
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_SERVER_URL: ${MINIO_PUBLIC_URL}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
  
  postgres:
    image: postgres:16-alpine
    ports:
    - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025" 
  
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"   # Порт для AMQP (твой Go-код будет стучаться сюда)
      - "15672:15672" # Веб-интерфейс (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  minio_data:
  pg_data:
